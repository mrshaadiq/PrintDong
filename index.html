<div class="stage">
  <div class="phone-wrap" id="phoneWrap">
    <div class="phone" id="phone">
      <div class="island" aria-hidden="true"></div>
      <div class="statusbar" id="statusbar" aria-hidden="true">
        <span class="sb-time" id="sbTime">20:16</span>
        <span class="sb-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0M4 6.9a6.4 6.4 0 0 1 9 0M6.6 9.5a2.8 2.8 0 0 1 3.8 0"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><rect x="25" y="4.2" width="1.6" height="4.6" rx=".8" opacity=".5"/></svg>
        </span>
      </div>
      <div id="app" class="app" role="application" aria-live="polite"></div>
      <div class="home-ind" aria-hidden="true"></div>
      <div id="toastHost" class="toast-host"></div>
    </div>
  </div>

  <aside class="demo" id="demoPanel" aria-label="Panel demo">
    <div class="demo-head">
      <strong>Panel demo</strong>
      <span>Alat bantu prototipe, bukan bagian aplikasi.</span>
    </div>
    <div class="demo-group">
      <h4>Pesanan aktif terbaru</h4>
      <div class="demo-row">
        <button data-act="demo-next" class="btn-mini primary">Majukan status</button>
        <button data-act="demo-jump" data-to="queue" class="btn-mini">Antre</button>
        <button data-act="demo-jump" data-to="printing" class="btn-mini">Dicetak</button>
        <button data-act="demo-jump" data-to="ready" class="btn-mini">Siap</button>
      </div>
      <label class="demo-check"><input type="checkbox" id="autoSim"> Majukan otomatis tiap 6 detik</label>
      <div class="demo-status" id="demoStatus">Belum ada pesanan aktif.</div>
    </div>
    <div class="demo-group">
      <h4>Loncat ke layar</h4>
      <div class="demo-grid" id="demoNav"></div>
    </div>
    <div class="demo-group">
      <button data-act="demo-reset" class="btn-mini danger">Reset semua data</button>
    </div>
  </aside>
  <button class="demo-fab" id="demoFab" data-act="demo-toggle" aria-label="Buka panel demo">Demo</button>
</div>

<script src="data.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
